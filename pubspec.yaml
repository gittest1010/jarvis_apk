name: voice_assistant
description: "Jarvis SRS Smart Launcher with Voice AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ----- CORE AI / VOICE -----
  picovoice_flutter: ^3.0.2
  audioplayers: ^6.1.0
  http: ^1.5.0

  # ----- LAUNCHER FEATURES -----
  installed_apps: ^1.6.0
  flutter_contacts: ^1.1.9
  flutter_phone_direct_caller: ^2.1.1

  # ----- UI & UTILITIES -----
  cupertino_icons: ^1.0.8

  # ----- SYSTEM PERMISSIONS & FEATURES -----
  permission_handler: ^11.4.0
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/keywords/
    - assets/contexts/