name: voice_assistant
description: "A Voice Assistant App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio & Networking
  audioplayers: ^6.0.0
  http: ^1.2.2
  permission_handler: ^11.3.1
  
  # Picovoice AI Stack
  # Note: 3.0.4 was discontinued, using newer versions
  picovoice_flutter: ^3.0.5
  rhino_flutter: ^3.0.5
  porcupine_flutter: ^3.0.5

  # System Utilities
  installed_apps: ^2.0.1
  wakelock_plus: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter_contacts: ^1.1.9+1
  flutter_phone_direct_caller: ^2.1.1
  
  # Path Provider (Required by many plugins internally)
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Ensure these folders exist and contain at least one file (like .gitkeep)
  assets:
    - assets/keywords/
    - assets/contexts/